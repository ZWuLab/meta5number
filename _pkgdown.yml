url: https://zwulab.github.io/meta5number/
template:
  bootstrap: 5
reference:
- title: A study's imputed mean and SD with their standard errors
  desc: The study-level function for practitioners.
  contents:
  - se_imputed
  - se_imputed_df
  - se_imputed_diff
- title: Pooling
  desc: The pooled estimate under the naive and the exact standard errors, side by side.
  contents:
  - pool_imputed
- title: The exact factors
  desc: The standard deviation factors and the inflation factors of the imputed mean and SD, under normality.
  contents:
  - c_mu
  - c_sigma
  - inflation_factors
  - imputed_moments
- title: The shortcut formulas
  desc: Closed forms in the sample size, with the constants as the companion paper prints them.
  contents:
  - c_mu_shortcut
  - c_sigma_shortcut
- title: Scenarios, weights and ranks
  desc: A scenario with any set of reported quantiles, the weights of the estimators and the ranks of the named scenarios.
  contents:
  - reporting_scenario
  - estimator_weights
  - scenario_ranks
- title: Data
  desc: The study summaries of the two meta-analyses of the second vignette, and six studies that report the median and the range.
  contents:
  - bun_icu
  - vitd
- title: Package
  contents:
  - meta5number-package
